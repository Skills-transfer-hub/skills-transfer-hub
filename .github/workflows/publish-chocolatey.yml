name: Publish to Chocolatey

# Called by release.yml only after GoReleaser and the signed-asset verification
# succeed. It remains manually dispatchable for an explicit stable-tag retry.

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Immutable commit SHA verified by release.yml
        required: false
        type: string
      tag:
        description: Stable release tag to publish (vX.Y.Z)
        required: true
        type: string
    secrets:
      CHOCOLATEY_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to (re)publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sth-chocolatey-publishing
  cancel-in-progress: false

jobs:
  chocolatey:
    name: Pack and push Chocolatey package
    runs-on: windows-latest
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_SIGNING_FINGERPRINT: SHA256:Y/USCQxn6KoP3GBU6Kr/3/POw4pqWgi/kukMAq1vwI0
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate stable release tag
        id: meta
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_SHA" && ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid expected commit SHA: $EXPECTED_SHA" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify signed tag provenance
        id: tag-provenance
        uses: actions/github-script@v8
        env:
          EXPECTED_SHA: ${{ env.EXPECTED_SHA }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${process.env.RELEASE_TAG}`,
            });
            if (ref.data.object.type !== 'tag') {
              throw new Error(`Release ref ${process.env.RELEASE_TAG} is not an annotated tag.`);
            }
            const tag = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: ref.data.object.sha,
            });
            if (!tag.data.verification?.verified) {
              throw new Error(`Release tag ${process.env.RELEASE_TAG} does not have a verified signature.`);
            }
            if (tag.data.object.type !== 'commit') {
              throw new Error(`Release tag ${process.env.RELEASE_TAG} does not point directly to a commit.`);
            }
            const commitSha = tag.data.object.sha;
            if (process.env.EXPECTED_SHA && commitSha !== process.env.EXPECTED_SHA) {
              throw new Error(`Signed tag commit ${commitSha} does not match expected commit ${process.env.EXPECTED_SHA}.`);
            }
            core.setOutput('commit_sha', commitSha);

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ steps.tag-provenance.outputs.commit_sha }}

      - name: Verify checked out tag
        shell: bash
        env:
          VERIFIED_SHA: ${{ steps.tag-provenance.outputs.commit_sha }}
        run: |
          actual_commit="$(git rev-parse HEAD)"
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{}")"
          if [[ "$actual_commit" != "$VERIFIED_SHA" || "$tag_commit" != "$VERIFIED_SHA" ]]; then
            echo "Checked out commit $actual_commit does not match $RELEASE_TAG ($VERIFIED_SHA)." >&2
            exit 1
          fi

      - name: Verify the pinned release signing key
        shell: bash
        run: |
          tag_object="$RUNNER_TEMP/sth-release-tag-object"
          tag_payload="$RUNNER_TEMP/sth-release-tag-payload"
          tag_signature="$RUNNER_TEMP/sth-release-tag-signature"
          git cat-file tag "refs/tags/$RELEASE_TAG" > "$tag_object"
          sed -n '/^-----BEGIN SSH SIGNATURE-----$/,$p' "$tag_object" > "$tag_signature"
          sed '/^-----BEGIN SSH SIGNATURE-----$/,$d' "$tag_object" > "$tag_payload"
          if ! verification="$(ssh-keygen -Y check-novalidate -n git -s "$tag_signature" < "$tag_payload" 2>&1)"; then
            printf '%s\n' "$verification" >&2
            exit 1
          fi
          if [[ "$verification" != *"$RELEASE_SIGNING_FINGERPRINT"* ]]; then
            echo "Release tag was not signed by the pinned release key." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download the signed checksum manifest from sth-releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: gh release download "$TAG" --repo Skills-transfer-hub/sth-releases --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.sig' --pattern 'sth-windows-amd64.zip' --dir .

      - name: Verify the checksum manifest signature
        shell: bash
        run: go run ./tools/release-sign --verify --in SHA256SUMS --signature SHA256SUMS.sig

      - name: Extract windows checksum
        id: sums
        shell: bash
        run: |
          checksum="$(awk '{ name = $NF; sub(/^\*/, "", name); if (name == "sth-windows-amd64.zip") print $1 }' SHA256SUMS)"
          if [[ -z "$checksum" ]]; then
            echo "Missing sth-windows-amd64.zip checksum in SHA256SUMS." >&2
            cat SHA256SUMS >&2
            exit 1
          fi
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Verify the windows archive checksum
        shell: pwsh
        env:
          EXPECTED_CHECKSUM: ${{ steps.sums.outputs.checksum }}
          VERIFIED_SHA: ${{ steps.tag-provenance.outputs.commit_sha }}
        run: |
          $actualChecksum = (Get-FileHash -Algorithm SHA256 -Path 'sth-windows-amd64.zip').Hash.ToLowerInvariant()
          if ($actualChecksum -ne $env:EXPECTED_CHECKSUM.ToLowerInvariant()) {
            throw "sth-windows-amd64.zip checksum mismatch"
          }
          $extractPath = Join-Path $env:RUNNER_TEMP 'sth-windows-verified'
          Expand-Archive -Path 'sth-windows-amd64.zip' -DestinationPath $extractPath -Force
          $metadata = (& (Join-Path $extractPath 'sth.exe') version --json | ConvertFrom-Json)
          $expectedVersion = $env:RELEASE_TAG.Substring(1)
          if ($metadata.version -ne $expectedVersion) {
            throw "Windows binary version $($metadata.version) does not match $expectedVersion"
          }
          if (-not $env:VERIFIED_SHA.StartsWith($metadata.commit)) {
            throw "Windows binary commit $($metadata.commit) does not match $env:VERIFIED_SHA"
          }

      - name: Render package files
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          CHECKSUM: ${{ steps.sums.outputs.checksum }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'choco-stage'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $stage 'tools') -Force | Out-Null

          $nuspec = Get-Content -Raw -Path 'packaging/chocolatey/sth.nuspec.template'
          $nuspec = $nuspec.Replace('__VERSION__', $env:VERSION)
          Set-Content -Path (Join-Path $stage 'sth.nuspec') -Value $nuspec -Encoding utf8

          $install = Get-Content -Raw -Path 'packaging/chocolatey/tools/chocolateyinstall.ps1.template'
          $install = $install.Replace('__VERSION__', $env:VERSION)
          $install = $install.Replace('__TAG__', $env:TAG)
          $install = $install.Replace('__CHECKSUM__', $env:CHECKSUM)
          Set-Content -Path (Join-Path $stage 'tools/chocolateyinstall.ps1') -Value $install -Encoding utf8

          Copy-Item 'packaging/chocolatey/tools/chocolateyuninstall.ps1' (Join-Path $stage 'tools/chocolateyuninstall.ps1')

          "STAGE=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: choco pack
        shell: pwsh
        run: choco pack (Join-Path $env:STAGE 'sth.nuspec') --output-directory $env:STAGE

      - name: choco push
        shell: pwsh
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          $package = Get-ChildItem -Path $env:STAGE -Filter 'sth.*.nupkg' | Select-Object -First 1
          if (-not $package) { throw "No .nupkg found in $env:STAGE" }
          choco push $package.FullName --source 'https://push.chocolatey.org/' --api-key $env:CHOCOLATEY_API_KEY
