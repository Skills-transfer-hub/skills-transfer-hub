name: Publish to Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to republish (e.g. v0.1.2)
        required: true

permissions:
  contents: read

jobs:
  homebrew:
    name: Update homebrew-sth tap
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false

    steps:
      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for i in $(seq 1 30); do
            assets="$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            if echo "$assets" | grep -q '^SHA256SUMS$' \
              && echo "$assets" | grep -q '^sth-darwin-arm64.tar.gz$' \
              && echo "$assets" | grep -q '^sth-darwin-amd64.tar.gz$' \
              && echo "$assets" | grep -q '^sth-linux-amd64.tar.gz$'; then
              echo "All required assets are present."
              exit 0
            fi
            echo "Waiting for release assets to be uploaded ($i/30)..."
            sleep 30
          done
          echo "Timed out waiting for release assets." >&2
          exit 1

      - name: Download SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern 'SHA256SUMS' --dir .

      - name: Extract checksums
        id: sums
        shell: bash
        run: |
          darwin_arm64="$(awk '$2 == "sth-darwin-arm64.tar.gz" { print $1 }' SHA256SUMS)"
          darwin_amd64="$(awk '$2 == "sth-darwin-amd64.tar.gz" { print $1 }' SHA256SUMS)"
          linux_amd64="$(awk '$2 == "sth-linux-amd64.tar.gz" { print $1 }' SHA256SUMS)"
          if [[ -z "$darwin_arm64" || -z "$darwin_amd64" || -z "$linux_amd64" ]]; then
            echo "Missing one or more SHA256 entries in SHA256SUMS." >&2
            cat SHA256SUMS >&2
            exit 1
          fi
          echo "darwin_arm64=$darwin_arm64" >> "$GITHUB_OUTPUT"
          echo "darwin_amd64=$darwin_amd64" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$linux_amd64" >> "$GITHUB_OUTPUT"

      - name: Render Formula/sth.rb
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DARWIN_ARM64: ${{ steps.sums.outputs.darwin_arm64 }}
          DARWIN_AMD64: ${{ steps.sums.outputs.darwin_amd64 }}
          LINUX_AMD64: ${{ steps.sums.outputs.linux_amd64 }}
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/sth.rb <<EOF
          class Sth < Formula
            desc "Skills Transfer Hub — CLI to install AI skills from a hosted catalog"
            homepage "https://github.com/Grandpied33/skills-transfer-hub"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/Grandpied33/skills-transfer-hub/releases/download/v#{version}/sth-darwin-arm64.tar.gz"
                sha256 "${DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/Grandpied33/skills-transfer-hub/releases/download/v#{version}/sth-darwin-amd64.tar.gz"
                sha256 "${DARWIN_AMD64}"
              end
            end

            on_linux do
              url "https://github.com/Grandpied33/skills-transfer-hub/releases/download/v#{version}/sth-linux-amd64.tar.gz"
              sha256 "${LINUX_AMD64}"
            end

            def install
              bin.install "sth"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/sth version")
            end
          end
          EOF

      - name: Checkout tap repository
        uses: actions/checkout@v4
        with:
          repository: Grandpied33/homebrew-sth
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-sth

      - name: Commit and push formula
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cd homebrew-sth
          mkdir -p Formula
          cp ../tap/Formula/sth.rb Formula/sth.rb
          if git diff --quiet Formula/sth.rb; then
            echo "Formula is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sth.rb
          git commit -m "sth ${VERSION}"
          git push
