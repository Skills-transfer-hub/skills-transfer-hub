name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build & publish via GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          # PAT with `contents:write` on Grandpied33/sth-releases (the public
          # artifacts repo). The default GITHUB_TOKEN can't push to a different
          # repo, so we use a Personal Access Token stored as RELEASE_PAT.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
