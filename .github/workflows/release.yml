name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    name: Build & publish via GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The curated, user-facing notes were written by auto-release.yml as the
      # body of the (private) source-repo release. Reuse them verbatim so the
      # public release and `sth update` highlights show exactly what we authored
      # — never raw commit subjects. Falls back to a safe generic line.
      - name: Prepare release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [[ -z "$tag" ]]; then tag="$(git describe --tags --abbrev=0)"; fi
          if ! gh release view "$tag" -R Grandpied33/skills-transfer-hub --json body --jq '.body' > release-notes.md 2>/dev/null || [[ ! -s release-notes.md ]]; then
            printf 'Maintenance & internal improvements.\n' > release-notes.md
          fi
          printf '\n---\nSee all releases: https://github.com/Grandpied33/sth-releases/releases\n' >> release-notes.md

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=release-notes.md
        env:
          # GoReleaser creates the release on the public Grandpied33/sth-releases repo
          # (cross-repo, the default GITHUB_TOKEN can't push there). RELEASE_PAT must
          # have Contents: R/W on skills-transfer-hub + sth-releases + the 3 tap repos.
          # WINGET_TOKEN must be a CLASSIC PAT with `public_repo` scope (fine-grained
          # PATs cannot create cross-fork PRs against microsoft/winget-pkgs).
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
