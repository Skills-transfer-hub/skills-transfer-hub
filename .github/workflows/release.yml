name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    name: Build & publish via GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Chocolatey is intentionally skipped from GoReleaser: the chocolateys
      # target needs the `choco` CLI in PATH on the runner, and on Linux
      # neither crazy-max/ghaction-chocolatey nor a manual mono+choco install
      # exposes it reliably. We'll re-add Chocolatey publishing via a dedicated
      # windows-latest workflow that uses `choco push` natively.

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=chocolatey
        env:
          # GoReleaser creates the release on the public Grandpied33/sth-releases repo
          # (cross-repo, the default GITHUB_TOKEN can't push there). RELEASE_PAT must
          # have Contents: R/W on skills-transfer-hub + sth-releases + the 3 tap repos.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
