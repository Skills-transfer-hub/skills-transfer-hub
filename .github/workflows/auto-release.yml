name: Auto Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  create-release:
    name: Create release after merge
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Fetch tags
        run: git fetch --force --tags origin

      - name: Resolve merged pull request metadata
        id: pr
        uses: actions/github-script@v7
        env:
          RELEASE_BODY_PATH: ${{ runner.temp }}/release-body.md
        with:
          script: |
            const fs = require('fs');

            // listPullRequestsAssociatedWithCommit is eventually consistent —
            // when triggered by `push: branches: main`, this workflow can race
            // the GitHub backend that records the PR↔merge-commit association,
            // and an early call returns an empty array. Concrete instance:
            // PR #151 merged at 19:00:29Z, workflow checked at 19:00:40Z, got
            // []. The same API call from a manual rerun ~15min later returned
            // the PR. To absorb that window, retry up to 6 times with a 10s
            // backoff (≈60s total) before declaring the commit unrelated.
            const MAX_ATTEMPTS = 6;
            const BACKOFF_MS = 10_000;
            let mergedPullRequest;
            for (let attempt = 1; attempt <= MAX_ATTEMPTS && !mergedPullRequest; attempt++) {
              if (attempt > 1) {
                core.info(`PR association not yet visible (attempt ${attempt - 1}/${MAX_ATTEMPTS}); retrying in ${BACKOFF_MS / 1000}s…`);
                await new Promise((resolve) => setTimeout(resolve, BACKOFF_MS));
              }
              const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              mergedPullRequest = pulls.data.find((pullRequest) =>
                pullRequest.base.ref === 'main' && pullRequest.merged_at,
              );
            }

            const labelNames = (mergedPullRequest?.labels ?? []).map((label) =>
              String(label.name ?? '').toLowerCase(),
            );

            const isPrerelease = labelNames.includes('prerelease') || labelNames.includes('pre-release');

            core.setOutput('found', String(Boolean(mergedPullRequest)));
            core.setOutput('number', mergedPullRequest ? String(mergedPullRequest.number) : '');
            core.setOutput('prerelease', String(isPrerelease));
            core.setOutput('labels', labelNames.join(', '));

            // The release body is published verbatim to the PUBLIC sth-releases
            // release and surfaced as `sth update` highlights, so it must be
            // user-facing and must NOT leak internals (endpoints, helper names,
            // auth/gating internals, file paths). We publish ONLY the
            // "## Release notes" section of the PR — authored in English for
            // users — never the technical Why/What/Tests sections or raw commit
            // subjects. Absent or empty -> a safe generic line.
            if (mergedPullRequest) {
              const prBody = String(mergedPullRequest.body ?? '');
              const collected = [];
              let inSection = false;
              for (const line of prBody.split(/\r?\n/)) {
                const heading = line.match(/^##\s+(.+?)\s*$/);
                if (heading) {
                  if (inSection) break;
                  inSection = heading[1].toLowerCase() === 'release notes';
                  continue;
                }
                if (inSection) collected.push(line);
              }
              let notes = collected.join('\n').replace(/<!--[\s\S]*?-->/g, '').trim();
              if (!/[A-Za-z0-9]/.test(notes)) notes = '';
              const finalNotes = notes || 'Maintenance & internal improvements.';

              fs.writeFileSync(process.env.RELEASE_BODY_PATH, finalNotes + '\n');
              core.setOutput('bodyPath', process.env.RELEASE_BODY_PATH);
            }

      - name: Detect existing tag on merged commit
        id: existing
        shell: bash
        run: |
          tag="$(git tag --points-at "${{ github.sha }}" | head -n 1)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Compute next stable version tag
        id: next
        if: steps.pr.outputs.found == 'true' && steps.existing.outputs.tag == ''
        shell: bash
        run: |
          latest="$(git tag --list 'v*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print }' | sort -V | tail -n 1)"
          if [[ -z "$latest" ]]; then
            stable_base="v0.0.1"
          else
            version="${latest#v}"
            IFS='.' read -r major minor patch <<< "$version"
            stable_base="v${major}.${minor}.$((patch + 1))"
          fi

          prerelease='${{ steps.pr.outputs.prerelease }}'
          if [[ "$prerelease" == 'true' ]]; then
            latest_rc="$(git tag --list "${stable_base}-rc.*" | awk '/-rc\.[0-9]+$/ { print }' | sort -V | tail -n 1)"
            if [[ -z "$latest_rc" ]]; then
              next="${stable_base}-rc.1"
            else
              rc_number="${latest_rc##*-rc.}"
              next="${stable_base}-rc.$((rc_number + 1))"
            fi
            make_latest='false'
          else
            next="$stable_base"
            make_latest='true'
          fi

          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "make_latest=$make_latest" >> "$GITHUB_OUTPUT"
          echo "Preparing release $next from PR #${{ steps.pr.outputs.number }} (labels: ${{ steps.pr.outputs.labels }})." >> "$GITHUB_STEP_SUMMARY"

      # action-gh-release creates a lightweight (unsigned) tag when the tag
      # doesn't exist yet. To get the green "Verified" badge on the release we
      # create a signed annotated tag here first; the release step below then
      # reuses it instead of creating its own. SSH signing key (RELEASE_SSH_
      # SIGNING_KEY) must be registered as a Signing Key on the account whose
      # verified email is RELEASE_SIGNING_EMAIL.
      - name: Set up SSH tag signing
        if: steps.pr.outputs.found == 'true' && steps.existing.outputs.tag == ''
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
          SIGNING_EMAIL: ${{ vars.RELEASE_SIGNING_EMAIL }}
          SIGNING_NAME: ${{ vars.RELEASE_SIGNING_NAME }}
        run: |
          if [[ -z "$SIGNING_KEY" || -z "$SIGNING_EMAIL" ]]; then
            echo "Missing RELEASE_SSH_SIGNING_KEY secret or RELEASE_SIGNING_EMAIL variable." >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SIGNING_KEY" > ~/.ssh/release_signing
          chmod 600 ~/.ssh/release_signing
          git config user.name "${SIGNING_NAME:-STH Release Bot}"
          git config user.email "$SIGNING_EMAIL"
          git config gpg.format ssh
          git config user.signingkey "$HOME/.ssh/release_signing"
          git config tag.gpgsign true

      - name: Create and push signed tag
        if: steps.pr.outputs.found == 'true' && steps.existing.outputs.tag == ''
        shell: bash
        run: |
          git tag -s "${{ steps.next.outputs.tag }}" -m "Release ${{ steps.next.outputs.tag }}" "${{ github.sha }}"
          git push origin "refs/tags/${{ steps.next.outputs.tag }}"

      - name: Create GitHub release
        if: steps.pr.outputs.found == 'true' && steps.existing.outputs.tag == ''
        uses: softprops/action-gh-release@v2
        with:
          # GITHUB_TOKEN-published releases do NOT trigger downstream workflows
          # (release.published event is suppressed). RELEASE_PAT runs as a real
          # user identity, so release.yml fires automatically on each release.
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: ${{ steps.next.outputs.tag }}
          name: ${{ steps.next.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.next.outputs.prerelease }}
          make_latest: ${{ steps.next.outputs.make_latest }}
          # body_path holds the curated "Release notes" section extracted from
          # the PR — the only thing published. We do NOT set generate_release_notes:
          # it would append GitHub's auto PR list and a private compare link, both
          # of which would then propagate to the public release.
          body_path: ${{ steps.pr.outputs.bodyPath }}

      - name: Skip if merged commit is already released
        if: steps.existing.outputs.tag != ''
        shell: bash
        run: |
          echo "Merged commit already has tag ${{ steps.existing.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Skip if push is not from a merged pull request
        if: steps.pr.outputs.found != 'true'
        shell: bash
        run: |
          echo "No merged pull request associated with commit ${{ github.sha }}; skipping automatic release." >> "$GITHUB_STEP_SUMMARY"
