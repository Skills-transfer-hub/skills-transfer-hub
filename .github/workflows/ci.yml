name: CI

on:
  # Branch pushes are only built on main and develop (post-merge validation).
  # Feature branches are covered by their pull_request run instead — this
  # avoids the classic double-run where a push event and a pull_request event
  # both fire for the same commit on a PR branch.
  push:
    branches:
      - main
      - develop
  pull_request:

# Cancel an in-flight run when a newer commit is pushed to the same ref, so a
# rapid series of pushes doesn't pile up billed runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  sth-code-contract:
    name: STH Code bridge contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Download the authoritative STH Code contract
        id: contract-source
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.STH_CODE_READ_TOKEN }}
          REQUIRE_PRIVATE_CONTRACT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            if [[ "$REQUIRE_PRIVATE_CONTRACT" == 'true' ]]; then
              echo 'STH_CODE_READ_TOKEN is required for main CI.' >&2
              exit 1
            fi
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Private consumer contract unavailable; local bridge tests remain required.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --method GET repos/Skills-transfer-hub/sth-code-private-archive/contents/scripts/verify-sth-code-engine-contract.mjs \
            -f ref=1435656322b212376e70e105873de364f905c9a4 \
            --jq .content | base64 --decode > "$RUNNER_TEMP/verify-sth-code-engine-contract.mjs"
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Verify local bridge tests
        shell: bash
        run: go test ./cmd -run 'TestBridge' -count=1
      - name: Build candidate and verify the private consumer contract
        if: steps.contract-source.outputs.available == 'true'
        shell: bash
        run: |
          go build -trimpath -o "$RUNNER_TEMP/sth" .
          node "$RUNNER_TEMP/verify-sth-code-engine-contract.mjs" "$RUNNER_TEMP/sth"

  test-and-build:
    name: Test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners bill at 10x; it's the priciest job by far. We keep it
        # off the per-PR path and run it only on main (post-merge) so macOS
        # regressions are still caught before a release, at ~1/10th the spend.
        # ubuntu + windows run on every PR.
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Prepare build metadata
        shell: pwsh
        run: |
          $goos = (go env GOOS).Trim()
          $goarch = (go env GOARCH).Trim()
          $archiveExt = if ($goos -eq 'windows') { 'zip' } else { 'tar.gz' }
          $assetName = "sth-$goos-$goarch.$archiveExt"
          "VERSION=dev-ci" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COMMIT=${{ github.sha }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TARGET=$goos/$goarch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_API_URL=https://api.github.com/repos/${{ github.repository }}/releases" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ASSET_NAME=$assetName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CHECKSUM_NAME=SHA256SUMS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # No -trimpath here: this build is only a compile-check, not a release
      # artifact (GoReleaser owns reproducible release builds in release.yml).
      # -trimpath rewrites every package's build-cache key, forcing a full
      # recompile that can't reuse the cache `go vet`/`go test` just warmed —
      # dropping it lets the build reuse those objects and only relink.
      - name: Build binary
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-X sth/cmd.version=$env:VERSION -X sth/cmd.commit=$env:COMMIT -X sth/cmd.buildDate=$env:BUILD_DATE -X sth/cmd.target=$env:TARGET -X sth/cmd.releaseAPIURL=$env:RELEASE_API_URL -X sth/cmd.releaseAssetName=$env:RELEASE_ASSET_NAME -X sth/cmd.releaseChecksumName=$env:RELEASE_CHECKSUM_NAME" -o sth .

  compatibility-hermetic:
    name: Compatibility hermetic
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

      - name: Verify strict runner proof (hermetic, no external runtime)
        run: |
          for script in scripts/compat-*.sh testdata/runtime/fake-cli/*.sh; do
            sh -n "$script"
          done
          sh scripts/compat-runtime-test.sh

      - name: Verify release manifest writer
        run: |
          sh -n scripts/write-sth-code-engine-manifest.sh scripts/write-sth-code-engine-manifest-test.sh scripts/resolve-release-asset.sh scripts/verify-release-assets.sh scripts/verify-release-assets-test.sh
          sh scripts/write-sth-code-engine-manifest-test.sh
          sh scripts/verify-release-assets-test.sh

      - name: Verify writer contracts
        run: go test ./internal/writer ./internal/fs/... -count=1

      - name: Verify lifecycle contracts
        run: go test ./cmd -run 'TestInstallFanout_ConsumerArtifactContracts|TestInstallFanout_AllConsumerContractsImplemented|TestInstallFanout_RollsBackFilesAndOwnershipWhenSecondTargetFails|TestInstallFanout_SkillRollsBackFirstHubWhenSecondHubFails|TestInstallFanout_SkillOwnershipRequiresForce|TestFanoutProjectPathRejectsParentSymlinkOutsideProject|TestFanoutRecordMigrationReplacesLegacyTarget|TestTransferAllFanoutOwnershipRemovesEveryClaimant|TestTransferAllFanoutOwnershipRemovesOrphanedManagedRegions|TestAppendFanoutManagedFileRejectsCaseCollision|TestGeminiCommandLifecycle|TestInstallUpdateStatusRemoveMatrix|TestSkillSynchronizationAcrossAllConsumers|TestArtifactSynchronizationAcrossAllConsumers|TestInstructionRegionsPreserveUserContentAndOtherContributors|TestInstructionRegionInstallRollsBackOnMalformedMarkers|TestInstructionRegionContributionsDeduplicateSharedFragment|TestInstructionForceTransferPreservesNewRegionOwner' -count=1

      - name: Verify STH binary lifecycle against local provider
        run: sh scripts/compat-sth-lifecycle-test.sh

      - name: Generate an ephemeral snapshot signing key
        shell: bash
        run: |
          key_output="$(go run ./tools/release-sign -genkey)"
          private_key="$(printf '%s\n' "$key_output" | sed -n 's/^STH_RELEASE_SIGNING_KEY=//p')"
          public_key="$(printf '%s\n' "$key_output" | sed -n 's/^releaseSigningPublicKeyBase64=//p')"
          test -n "$private_key"
          test -n "$public_key"
          echo "::add-mask::$private_key"
          printf 'STH_RELEASE_SIGNING_KEY=%s\n' "$private_key" >> "$GITHUB_ENV"
          printf 'STH_RELEASE_SIGNING_PUBKEY=%s\n' "$public_key" >> "$GITHUB_ENV"

      - name: Build the signed release snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
        env:
          STH_RELEASE_SIGNING_KEY: ${{ env.STH_RELEASE_SIGNING_KEY }}

      - name: Verify the signed release snapshot
        shell: bash
        run: |
          snapshot_version="$(jq -r '.engine_version' .release/sth-code-engine.json)"
          sh scripts/verify-release-assets.sh dist "$snapshot_version"
          engine_path="$(sh scripts/resolve-release-asset.sh dist sth-engine-linux-amd64)"
          bridge_version="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"handshake","params":{"protocol_version":1}}' | "$engine_path" bridge --stdio | jq -er '.result.bridge_version')"
          if [ "$bridge_version" != "$snapshot_version" ]; then
            echo "Snapshot bridge version $bridge_version does not match manifest version $snapshot_version." >&2
            exit 1
          fi

  # Single stable status check to require in branch protection. Because the
  # matrix composition varies by event (macOS only on main), requiring the
  # individual "Test and build (<os>)" legs would block every PR waiting on a
  # macos-latest check that never runs there. This gate aggregates the matrix
  # result into one check name that's always produced — require "CI gate".
  ci-gate:
    name: CI gate
    if: always()
    needs: [sth-code-contract, test-and-build, compatibility-hermetic]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs passed
        run: |
          result='${{ needs.test-and-build.result }}'
          if [ "$result" != "success" ]; then
            echo "test-and-build did not succeed (result: $result)"
            exit 1
          fi
          compatibility='${{ needs.compatibility-hermetic.result }}'
          if [ "$compatibility" != "success" ]; then
            echo "compatibility-hermetic did not succeed (result: $compatibility)"
            exit 1
          fi
          sth_code_contract='${{ needs.sth-code-contract.result }}'
          if [ "$sth_code_contract" != "success" ]; then
            echo "sth-code-contract did not succeed (result: $sth_code_contract)"
            exit 1
          fi
          echo "All test-and-build, compatibility, and contract jobs succeeded."

  auto-release:
    name: Auto Release
    needs: ci-gate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci-gate.result == 'success'
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/auto-release.yml
    with:
      release_sha: ${{ github.sha }}
    secrets:
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
      RELEASE_SSH_SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
