# GoReleaser config for sth.
# Docs: https://goreleaser.com/customization/
#
# Local smoke test (no publish):
#   goreleaser release --snapshot --clean --skip=publish
#
# What this produces per release:
#   - sth-{linux,darwin,windows}-{amd64,arm64} binaries (Linux/Win arm64 skipped)
#   - sth-{os}-{arch}.{tar.gz|zip} archives + SHA256SUMS, attached to the
#     GitHub Release on Grandpied33/sth-releases
#   - sth.rb pushed to Grandpied33/homebrew-sth/Formula/
#   - sth.json pushed to Grandpied33/scoop-sth/bucket/
#
# All three pushes use GITHUB_TOKEN (set to RELEASE_PAT in release.yml).

version: 2

project_name: sth

before:
  hooks:
    - go vet ./...
    - go test ./...

builds:
  - id: sth
    main: .
    binary: sth
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X sth/cmd.version={{.Version}}
      - -X sth/cmd.commit={{.ShortCommit}}
      - -X sth/cmd.buildDate={{.Date}}
      - -X sth/cmd.target={{.Os}}/{{.Arch}}
      - -X sth/cmd.releaseAPIURL=https://api.github.com/repos/Grandpied33/sth-releases/releases
      - -X sth/cmd.releaseAssetName=sth-{{.Os}}-{{.Arch}}{{ if eq .Os "windows" }}.zip{{ else }}.tar.gz{{ end }}
      - -X sth/cmd.releaseChecksumName=SHA256SUMS
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Match the existing release matrix: skip linux/arm64 and windows/arm64.
      # Add them back when there's user demand.
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "sth-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

# Homebrew Formula auto-pushed to Grandpied33/homebrew-sth on each release.
# Authenticated via the GITHUB_TOKEN env var (see release.yml — set to RELEASE_PAT,
# a PAT with contents:write on all three target repos).
brews:
  - name: sth
    repository:
      owner: Grandpied33
      name: homebrew-sth
    homepage: "https://github.com/Grandpied33/sth-releases"
    description: "Skills Transfer Hub CLI — install reusable AI skills, agents and commands."
    install: |
      bin.install "sth"
    test: |
      assert_match "STH", shell_output("#{bin}/sth version")

# Scoop manifest auto-pushed to Grandpied33/scoop-sth on each release. Same
# auth as brews above.
scoops:
  - name: sth
    repository:
      owner: Grandpied33
      name: scoop-sth
    homepage: "https://github.com/Grandpied33/sth-releases"
    description: "Skills Transfer Hub CLI — install reusable AI skills, agents and commands."

release:
  github:
    owner: Grandpied33
    name: sth-releases
