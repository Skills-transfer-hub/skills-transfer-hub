# GoReleaser config for sth.
# Docs: https://goreleaser.com/customization/
#
# Architecture: source code on Skills-transfer-hub/skills-transfer-hub (PRIVATE),
# binaries + manifests on Skills-transfer-hub/sth-releases (PUBLIC). All download URLs
# referenced by the package managers point at sth-releases so users can install
# without GitHub auth.
#
# Local smoke test (no publish):
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish,chocolatey
#
# What this produces per stable release:
#   - sth-{linux,darwin}-{amd64,arm64} + sth-windows-amd64 binaries (Linux/Win arm64 skipped)
#   - sth-{os}-{arch}.{tar.gz|zip} archives + SHA256SUMS, attached to a NEW GitHub Release
#     created on Skills-transfer-hub/sth-releases (cross-repo, requires RELEASE_PAT)
#   - Formula/sth.rb pushed to Skills-transfer-hub/homebrew-sth (HOMEBREW_TAP_TOKEN)
#   - bucket/sth.json pushed to Skills-transfer-hub/scoop-sth (SCOOP_BUCKET_TOKEN)
#   - sth.nupkg pushed to chocolatey.org (CHOCOLATEY_API_KEY)
#   - PR opened against microsoft/winget-pkgs from Skills-transfer-hub/winget-pkgs (WINGET_TOKEN)

version: 2

project_name: sth

before:
  hooks:
    - go mod download
    - go vet ./...

builds:
  - id: sth
    main: .
    binary: sth
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X sth/cmd.version={{.Version}}
      - -X sth/cmd.commit={{.ShortCommit}}
      - -X sth/cmd.buildDate={{.Date}}
      - -X sth/cmd.target={{.Os}}/{{.Arch}}
      - -X sth/cmd.releaseAPIURL=https://api.github.com/repos/Skills-transfer-hub/sth-releases/releases
      - -X sth/cmd.releaseAssetName=sth-{{.Os}}-{{.Arch}}{{ if eq .Os "windows" }}.zip{{ else }}.tar.gz{{ end }}
      - -X sth/cmd.releaseChecksumName=SHA256SUMS
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "sth-{{ .Os }}-{{ .Arch }}"
    # No wrap_in_directory: keep the binary at the archive root.
    # Reason: the winget portable installer fails with a nested
    # RelativeFilePath like "sth-windows-amd64\sth.exe" — winget
    # expects the binary at the zip root (matches what every other
    # GoReleaser-published Go CLI does on winget-pkgs).
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

# Detached ed25519 signature of SHA256SUMS, uploaded as SHA256SUMS.sig. The CLI
# verifies it (internal/fs/signing.go) before trusting any checksum, so a
# compromised release host cannot serve a tampered binary + matching manifest.
# Requires the STH_RELEASE_SIGNING_KEY secret (base64 ed25519 private key);
# generate with `go run ./tools/release-sign -genkey` and paste the public key
# into releaseSigningPublicKeyBase64.
signs:
  - id: checksums
    artifacts: checksum
    signature: "${artifact}.sig"
    cmd: go
    args:
      - run
      - ./tools/release-sign
      - --key-env
      - STH_RELEASE_SIGNING_KEY
      - --in
      - "${artifact}"
      - --out
      - "${signature}"
    output: true

snapshot:
  name_template: "{{ incpatch .Version }}-snapshot"

# Release notes are authored by hand: auto-release.yml extracts the curated
# "## Release notes" section from the merged PR, and release.yml passes it to
# GoReleaser via --release-notes, which OVERRIDES this generated changelog.
# We must NOT set `disable: true` here: per GoReleaser docs it also ignores
# --release-notes and renders an empty body. release.yml always writes a
# non-empty notes file (curated notes or a safe fallback), so the commit-
# derived list below is always overridden and never reaches the release.
changelog:
  use: github
  filters:
    exclude:
      - "^ci:"
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Skills-transfer-hub
    name: sth-releases
  # Alpha period: prefix the release title; the tag stays plain semver.
  name_template: "Alpha {{ .Tag }}"
  prerelease: auto

brews:
  - name: sth
    repository:
      owner: Skills-transfer-hub
      name: homebrew-sth
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/Skills-transfer-hub/sth-releases"
    description: "Skills Transfer Hub (Alpha) — CLI to install AI skills from a hosted catalog."
    license: MIT
    skip_upload: auto
    install: |
      bin.install "sth"
    test: |
      assert_match "STH", shell_output("#{bin}/sth version")

scoops:
  - name: sth
    repository:
      owner: Skills-transfer-hub
      name: scoop-sth
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Scoop manifest update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/Skills-transfer-hub/sth-releases"
    description: "Skills Transfer Hub (Alpha) — CLI to install AI skills."
    license: MIT
    skip_upload: auto

# Chocolatey is intentionally NOT a GoReleaser target: the chocolateys
# block needs `choco` in PATH on the runner, and that's not reliable on
# Linux runners. The `chocolatey` job in .github/workflows/release.yml
# runs on windows-latest and uses the templates in packaging/chocolatey/
# to pack and push the package natively.

winget:
  - name: sth
    publisher: Skills-Transfer-Hub
    package_identifier: STH.STH
    short_description: (Alpha) CLI to install and update AI skill bundles from a hosted catalog.
    description: |
      STH (Skills Transfer Hub, Alpha) is a single-binary Go CLI that connects a project
      to a hosted catalog of AI resources, reads SKILLS.md, installs resources
      locally, and keeps them in sync.
    homepage: https://github.com/Skills-transfer-hub/sth-releases
    license: MIT
    license_url: https://github.com/Skills-transfer-hub/sth-releases/blob/main/LICENSE
    publisher_url: https://sth-dashboard.vercel.app/
    publisher_support_url: https://github.com/Skills-transfer-hub/sth-releases/issues
    release_notes_url: https://github.com/Skills-transfer-hub/sth-releases/releases/tag/v{{ .Version }}
    skip_upload: auto
    repository:
      owner: Skills-transfer-hub
      name: winget-pkgs
      branch: "sth-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
