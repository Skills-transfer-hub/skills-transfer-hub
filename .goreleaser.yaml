# GoReleaser config for sth.
# Docs: https://goreleaser.com/customization/
#
# Architecture: source code on Grandpied33/skills-transfer-hub (PRIVATE),
# binaries + manifests on Grandpied33/sth-releases (PUBLIC). All download URLs
# referenced by the package managers point at sth-releases so users can install
# without GitHub auth.
#
# Local smoke test (no publish):
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish,chocolatey
#
# What this produces per stable release:
#   - sth-{linux,darwin}-{amd64,arm64} + sth-windows-amd64 binaries (Linux/Win arm64 skipped)
#   - sth-{os}-{arch}.{tar.gz|zip} archives + SHA256SUMS, attached to a NEW GitHub Release
#     created on Grandpied33/sth-releases (cross-repo, requires RELEASE_PAT)
#   - Formula/sth.rb pushed to Grandpied33/homebrew-sth (HOMEBREW_TAP_TOKEN)
#   - bucket/sth.json pushed to Grandpied33/scoop-sth (SCOOP_BUCKET_TOKEN)
#   - sth.nupkg pushed to chocolatey.org (CHOCOLATEY_API_KEY)
#   - PR opened against microsoft/winget-pkgs from Grandpied33/winget-pkgs (WINGET_TOKEN)

version: 2

project_name: sth

before:
  hooks:
    - go mod download
    - go vet ./...

builds:
  - id: sth
    main: .
    binary: sth
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X sth/cmd.version={{.Version}}
      - -X sth/cmd.commit={{.ShortCommit}}
      - -X sth/cmd.buildDate={{.Date}}
      - -X sth/cmd.target={{.Os}}/{{.Arch}}
      - -X sth/cmd.releaseAPIURL=https://api.github.com/repos/Grandpied33/sth-releases/releases
      - -X sth/cmd.releaseAssetName=sth-{{.Os}}-{{.Arch}}{{ if eq .Os "windows" }}.zip{{ else }}.tar.gz{{ end }}
      - -X sth/cmd.releaseChecksumName=SHA256SUMS
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "sth-{{ .Os }}-{{ .Arch }}"
    # No wrap_in_directory: keep the binary at the archive root.
    # Reason: the winget portable installer fails with a nested
    # RelativeFilePath like "sth-windows-amd64\sth.exe" — winget
    # expects the binary at the zip root (matches what every other
    # GoReleaser-published Go CLI does on winget-pkgs).
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

snapshot:
  name_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - 'merge conflict'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Grandpied33
    name: sth-releases
  prerelease: auto

brews:
  - name: sth
    repository:
      owner: Grandpied33
      name: homebrew-sth
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/Grandpied33/sth-releases"
    description: "Skills Transfer Hub — CLI to install AI skills from a hosted catalog."
    license: MIT
    skip_upload: auto
    install: |
      bin.install "sth"
    test: |
      assert_match "STH", shell_output("#{bin}/sth version")

scoops:
  - name: sth
    repository:
      owner: Grandpied33
      name: scoop-sth
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Scoop manifest update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/Grandpied33/sth-releases"
    description: "Skills Transfer Hub — CLI to install AI skills."
    license: MIT
    skip_upload: auto

# Chocolatey is intentionally NOT a GoReleaser target: the chocolateys
# block needs `choco` in PATH on the runner, and that's not reliable on
# Linux runners. The `chocolatey` job in .github/workflows/release.yml
# runs on windows-latest and uses the templates in packaging/chocolatey/
# to pack and push the package natively.

winget:
  - name: sth
    publisher: Skills-Transfer-Hub
    package_identifier: Grandpied33.STH
    short_description: CLI to install and update AI skill bundles from a hosted catalog.
    description: |
      STH (Skills Transfer Hub) is a single-binary Go CLI that connects a project
      to a hosted catalog of AI resources, reads SKILLS.md, installs resources
      locally, and keeps them in sync.
    homepage: https://github.com/Grandpied33/sth-releases
    license: MIT
    license_url: https://github.com/Grandpied33/sth-releases/blob/main/LICENSE
    publisher_url: https://sth-dashboard.vercel.app/
    publisher_support_url: https://github.com/Grandpied33/sth-releases/issues
    release_notes_url: https://github.com/Grandpied33/sth-releases/releases/tag/v{{ .Version }}
    skip_upload: auto
    repository:
      owner: Grandpied33
      name: winget-pkgs
      branch: "sth-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
